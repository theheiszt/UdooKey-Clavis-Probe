[platformio]
default_envs = rp2040_logic_analyzer

[env:rp2040_logic_analyzer]
platform  = https://github.com/maxgerhardt/platform-raspberrypi/archive/refs/heads/develop.zip
board     = generic
framework = arduino
board_build.core          = earlephilhower
board_build.filesystem_size = 0.5m

platform_packages =
    framework-arduinopico@symlink://C:/Users/Andrew/.platformio/packages/framework-arduinopico

build_flags =
    -I src
    -I ../shared
    ; Main ST7735 Display (Existing Bottom Screen hardware)
    -D TFT_CS=13
    -D TFT_DC=12
    -D TFT_RST=11
    -D TFT_MOSI=19
    -D TFT_SCK=18
    -D TFT_MISO=20
    ; Hardware Triggers & Front-End Control
    -D PIN_EXT_TRIG=10
    -D PIN_FRONTEND_PRESCALER=14
    ; Five-Button Navigation Pins (Active LOW to GND, internal pull-ups enabled)
    -D PIN_BTN_UP=15
    -D PIN_BTN_DOWN=16
    -D PIN_BTN_LEFT=17
    -D PIN_BTN_RIGHT=21
    -D PIN_BTN_SELECT=22

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1

monitor_speed   = 115200
upload_protocol = picotool
