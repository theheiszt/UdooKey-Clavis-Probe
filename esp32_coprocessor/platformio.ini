[platformio]
default_envs = esp32_coprocessor

[env:esp32_coprocessor]
platform  = espressif32
; UDOO KEY MCU: Espressif ESP32-D0WDQ6 / ESP32-D0WD-V3 (UDOO KEY BASIC)
;   Flash : 4 MB
;   Module: ESP32-WROOM-32 / ESP32-D0WDQ6 (No external PSRAM on BASIC)
board     = esp32dev
framework = arduino

board_build.flash_size        = 4MB
board_build.flash_mode        = dio
board_build.partitions        = huge_app.csv

build_flags =
    -I ../shared
    -D CORE_DEBUG_LEVEL=2

lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
    h2zero/NimBLE-Arduino@^1.4.1

monitor_speed = 115200
upload_speed  = 460800
