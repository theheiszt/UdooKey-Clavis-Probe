[platformio]
default_envs = rp2040_hid

[env:rp2040_hid]
platform  = https://github.com/maxgerhardt/platform-raspberrypi.git
board     = generic
framework = arduino
board_build.core          = earlephilhower
board_build.filesystem_size = 0.5m

; ─── SPI / Display build flags ───────────────────────────────────────────────
; Both ST7735 screens share SPI0 (SCK=18, MOSI=19, MISO=20)
;   SCREEN_DISP : main display (left)   — CS=17, DC=16, RST=15
;   SCREEN_CTRL : touch menu  (right)   — CS=13, DC=12, RST=11
;   TOUCH_XPT   : XPT2046 touch ctrl   — CS=9,  IRQ=8
; LDR / HID pins unchanged (26=LDR, 0/1=UART, 6=BTN, 7=LED)
build_flags =
    -I ../shared
    -D PIN_SERIAL1_TX=0
    -D PIN_SERIAL1_RX=1
    -D USBD_VID=0x05AC
    -D USBD_PID=0x0250
    -D USBD_MANUFACTURER='"Apple Inc."'
    -D USBD_PRODUCT='"Magic Keyboard"'
    -D CFG_TUSB_MCU=OPT_MCU_RP2040
    -D SPI_SPEED=40000000
    ; Display screen (status/info panel)  — 1.44" 128x128 ST7735
    -D DISP_CS=17
    -D DISP_DC=16
    -D DISP_RST=15
    -D DISP_BL=14
    ; Control screen (touch menu)         — 1.44" 128x128 ST7735
    -D CTRL_CS=13
    -D CTRL_DC=12
    -D CTRL_RST=11
    -D CTRL_BL=10
    ; XPT2046 touch (on control screen)
    -D TOUCH_CS=9
    -D TOUCH_IRQ=8
    ; Shared SPI0 bus
    -D TFT_MOSI=19
    -D TFT_SCK=18
    -D TFT_MISO=20
    ; LDR
    -D LDR_ADC_PIN=26
    ; 1.44" 128x128 ST7735 — GREENTAB init
    -D TFT_W=128
    -D TFT_H=128
    -D USE_TFT_DISPLAY=1

lib_deps =
    adafruit/Adafruit TinyUSB Library@^3.4.0
    arduino-libraries/Keyboard@^1.0.6
    arduino-libraries/Mouse@^1.0.1
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1
    PaulStoffregen/XPT2046_Touchscreen@^1.4

monitor_speed   = 115200
upload_protocol = picotool
